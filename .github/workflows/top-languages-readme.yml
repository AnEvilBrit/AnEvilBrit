name: Top-Languages Readme

on:
    workflow_dispatch:
    schedule:
        - cron: '0 0 * * *'

jobs:
    update-readme:
        name: Update this repo's README
        runs-on: ubuntu-latest
        steps:
        - uses: anevilbrit/top-languages-readme@master
          with:
            GH_TOKEN: ${{ secrets.GH_TOKEN }}
